<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fléchettes – saisie manuelle</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecd9;--panel:#fffaf0;--ink:#1b1712;--mute:#6f6556;--line:#d8ccb2;--red:#b8302a;--green:#1f6f46;--on:#fffaf0;--hi:#fbe3a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--panel:#211b16;--ink:#f3ecd9;--mute:#a79a86;--line:#3a3128;--red:#e0584f;--green:#3fae75;--on:#15110e;--hi:#3b2f17}}
:root[data-theme="dark"]{--bg:#15110e;--panel:#211b16;--ink:#f3ecd9;--mute:#a79a86;--line:#3a3128;--red:#e0584f;--green:#3fae75;--on:#15110e;--hi:#3b2f17}
*{box-sizing:border-box;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.5px}
h1{font-size:30px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button.main{background:var(--red);color:#fff;border-color:var(--red)}
button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.games{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.games button{grid-column:span 2}
.games button{font-family:"Barlow Condensed",sans-serif;font-size:clamp(20px,6vw,28px);padding:14px 4px;min-height:70px}
input[type=text]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.pl{display:flex;gap:8px;margin:6px 0}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px}
.card.cur{border-color:var(--red);background:var(--hi)}
.card.out{opacity:.4}
.name{font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:"Barlow Condensed",sans-serif;font-size:56px;line-height:1;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:center}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:22px}
th{font-weight:600}
th:first-child,td:first-child{text-align:left}
.cur-col{background:var(--hi)}
.status{min-height:26px;margin:10px 0 6px;font-weight:600}
.darts{display:flex;gap:6px;margin:6px 0}
.dart{flex:1;text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:6px;font-family:"Barlow Condensed",sans-serif;font-size:22px;min-height:38px}
.mult{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.pad{min-height:250px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px}
.pad button{padding:0;font-size:clamp(22px,6vw,38px);font-family:"Barlow Condensed",sans-serif}
.pad button:disabled{opacity:.25}
.win{background:var(--green);color:#fff;border-radius:12px;padding:14px;text-align:center;margin:10px 0}
.win .big{font-size:40px}
body[data-game="Training"],body[data-game="301"]{--bg:#131313;--panel:#1f1f1f;--ink:#f4eedd;--mute:#a89f8c;--line:#3a3a3a;--red:#d63a2f;--green:#2f9e5f;--hi:#3a1a17}
body[data-game="501"]{--bg:#131313;--panel:#1f1f1f;--ink:#f4eedd;--mute:#a89f8c;--line:#3a3a3a;--red:#d63a2f;--green:#2f9e5f;--hi:#3a1a17}
body[data-game="Cricket"]{--bg:#0c0c0c;--panel:#181818;--ink:#f2f0e6;--mute:#a9a9a0;--line:#3a3a3a;--red:#e5483c;--green:#2f9e5f;--hi:#2a1614}
body[data-game="Killer"]{--bg:#12080d;--panel:#20101a;--ink:#f6e8ea;--mute:#b49aa2;--line:#4a2433;--red:#ff3b4a;--green:#b3203f;--hi:#3a1220}
body[data-game="301"] .big,body[data-game="501"] .big{font-size:72px}
.bar01{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar01 i{display:block;height:100%;background:var(--red)}
body[data-game="Cricket"] td{font-size:26px;border-bottom:1px dashed var(--line)}
body[data-game="Cricket"] .mk{color:var(--red)}
body[data-game="Cricket"] .pad{grid-template-columns:repeat(5,1fr)}
body[data-game="Cricket"] .pad button{font-size:clamp(26px,7vw,44px)}
body[data-game="Killer"] h2{color:var(--red)}
body[data-game="Killer"] .card{text-align:center}
.wrap>*{flex:none}
.wrap>.pad{flex:1 1 auto}
.avg{font:700 22px "Barlow Condensed",sans-serif;color:var(--ink)}
.co{font-family:"Barlow Condensed",sans-serif;font-size:20px;min-height:24px}
.prog{font:700 48px "Barlow Condensed",sans-serif;line-height:1}
.kb{font:700 34px "Barlow Condensed",sans-serif;color:var(--red);line-height:1.1}
.badge{width:64px;height:64px;border-radius:50%;border:4px solid var(--red);display:flex;align-items:center;justify-content:center;font:700 30px "Barlow Condensed",sans-serif;margin:6px auto;box-shadow:0 0 0 4px var(--panel),0 0 0 6px var(--line)}
.hearts{color:var(--red);font-size:24px}
.hearts span{opacity:.25}
.card.kil{border-color:var(--red);box-shadow:0 0 14px var(--red)}
.status.x2{color:var(--red)}
.kpad{display:flex!important;gap:6px}
.cards.many{display:flex;overflow-x:auto;position:relative;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.cards.many .card{flex:0 0 min(46%,200px);scroll-snap-align:center}
.scroll{position:relative}
.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;z-index:2;background:var(--bg);padding-right:8px}
.mini span{white-space:nowrap}
.b01{display:flex;align-items:center;gap:4px;min-width:0}
.b01 .big{flex:none}
body[data-game="301"] .b01 .big,body[data-game="501"] .b01 .big{font-size:clamp(46px,14vw,72px)}
.beer{display:block;flex:1 1 0;min-width:0;height:clamp(110px,30vw,170px);margin:0}
.kcol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.kcol button{flex:1;min-height:50px}
body[data-game="Killer"] .kpad{min-height:170px}
.mini .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.dart.ok{border-color:#e6b93a;color:#e6b93a;border-style:solid}
.dart.ko{opacity:.6}
#snp{position:fixed;inset:0;z-index:60;overflow:hidden;pointer-events:auto}
#snp .scope{position:absolute;border-radius:50%;will-change:transform;box-shadow:0 0 0 150vmax rgba(0,0,0,.93),inset 0 0 40px 12px rgba(0,0,0,.85);background:radial-gradient(circle,rgba(120,200,255,.06) 0,rgba(0,0,0,.15) 70%)}
#snp .scope{overflow:hidden}
#snp .scope svg{width:100%;height:100%;display:block;position:relative;z-index:2}
#snp .zm{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,var(--panel) 0,var(--panel) 55%,#000 100%);opacity:0}
#snp .zm .splat{position:absolute;z-index:3;left:50%;top:50%;width:62%;height:62%;margin:-31% 0 0 -31%;opacity:0;mix-blend-mode:normal;pointer-events:none}
#snp .zm span{font:700 clamp(40px,12vw,64px)/1 "Barlow Condensed",sans-serif;color:var(--ink);max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 6px #000}
#snp .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#rice{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#rice i{position:absolute;top:0;width:5px;height:13px;border-radius:50%;background:linear-gradient(90deg,#fffdf6,#f1ead8 55%,#d6cdb6);box-shadow:0 0 2px rgba(0,0,0,.45);opacity:.92;animation-name:riceFall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes riceFall{0%{translate:0 -20px;rotate:var(--r1)}100%{translate:var(--dx) 105vh;rotate:var(--r2)}}
@media (prefers-reduced-motion:reduce){#rice i{animation-duration:12s!important}}
.choice .full{background:#1b4d8c;color:#fff;border-color:#1b4d8c}
tr.xrow td:first-child{font-size:20px;color:var(--mute)}
.pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.pickin{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;width:min(100%,460px)}
.pickin h2{text-align:center;margin-bottom:10px;font-size:28px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pgrid button{font:700 clamp(18px,5vw,24px) "Barlow Condensed",sans-serif;padding:12px 0}
.pcancel{width:100%;margin-top:10px}
#batfx .gout{position:absolute;left:50%;top:66%;font:700 clamp(64px,19vw,140px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap;opacity:0}
.pgrid+.hint,.pickin .hint{text-align:center}
.pad .bedb{background:#1b4d8c!important;border-color:#1b4d8c!important;color:#fff}
#batfx .cn.wide{font-size:clamp(60px,18vw,140px)}
#batfx{position:fixed;inset:0;z-index:60;overflow:hidden}
#batfx .cn{position:absolute;left:55%;top:50%;font:700 clamp(110px,34vw,220px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap}
#batfx .bt{position:absolute;left:calc(55% - clamp(90px,26vw,170px));top:calc(50% - min(62vw,300px));width:min(14vw,62px);height:min(62vw,300px);transform-origin:50% 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
#batfx .hit{position:absolute;left:calc(55% - clamp(30px,10vw,70px));top:50%;width:min(50vw,220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6c8 25%,rgba(247,201,72,.6) 45%,rgba(247,201,72,0) 70%);opacity:0;pointer-events:none}
#bfx{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);overflow:hidden}
#bfx .bmug{position:absolute;left:50%;top:44%;width:min(62vw,280px);margin:calc(min(62vw,280px)*-.575) 0 0 calc(min(62vw,280px)*-.5)}
#bfx .bmug .beer{width:100%;height:auto;margin:0}
#bfx .btx{position:absolute;left:50%;top:70%;font:700 clamp(60px,18vw,120px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap;opacity:0}
#bfx.bust .bmug{left:30%;width:min(46vw,210px);margin:calc(min(46vw,210px)*-.575) 0 0 calc(min(46vw,210px)*-.5)}
#bfx .pud{position:absolute;left:calc(30% + min(46vw,210px)*.75);top:calc(44% + min(46vw,210px)*.47);width:min(60vw,280px);height:min(12vw,50px);border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#ffd25a,#e39a12 60%,rgba(217,130,0,0) 72%);opacity:0;transform-origin:0 50%}
#bfx i{position:absolute;top:30%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,246,200,.9);background:rgba(255,210,90,.25);opacity:0;animation:bubUp 1.1s ease-out forwards}
#bfx i{animation-duration:1.6s}
@keyframes bubUp{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-34vh) scale(1.2)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx .rb{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font:700 clamp(90px,28vw,200px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap;background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe23b,#3bd16f,#2ea8ff,#7b5cff,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 4px rgba(0,0,0,.9));animation:ppIn .45s cubic-bezier(.2,1.6,.4,1) both,fxOut .35s ease-in 1.65s forwards}
#fx .bed{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(var(--r));font:700 clamp(60px,18vw,170px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap;animation:ppIn .5s cubic-bezier(.2,1.6,.4,1) both,fxOut .35s ease-in 1.65s forwards}
#fx .bullfx{position:absolute;left:50%;top:50%;width:min(80vw,60vh,440px);height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 18px rgba(0,0,0,.85)) drop-shadow(0 0 22px rgba(247,201,72,.55));animation:bullIn .5s cubic-bezier(.2,1.5,.4,1) both,fxOut .35s ease-in 1.65s forwards}
@keyframes bullIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fxOut{to{opacity:0}}
#pp{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#pp span{position:absolute;transform:translate(-50%,-50%) rotate(var(--r)) scale(1);font:700 clamp(64px,20vw,140px)/1 "Barlow Condensed",Impact,sans-serif;white-space:nowrap;animation:ppIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ppIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--r) - 25deg)) scale(.2)}100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
.x2b{font:700 clamp(30px,9vw,48px)/1.1 "Barlow Condensed",sans-serif;text-align:center;color:#fff;background:var(--red);border-radius:12px;padding:6px 10px;margin:10px 0 0;letter-spacing:2px;text-transform:uppercase;box-shadow:0 0 18px var(--red)}
body[data-game="Killer"] .pad{grid-template-columns:repeat(3,1fr)}
.pad button small{display:block;font:600 15px Barlow,system-ui,sans-serif;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:.3;pointer-events:none;z-index:0}
#bg svg{width:min(95vmin,720px);height:min(95vmin,720px)}
.wrap{position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.chip.on{border-color:var(--green);padding-left:12px;font-weight:600}
.chip button{border:0;background:transparent;border-radius:0;padding:8px 12px}
.chip button:disabled{opacity:.5}
body[data-game] #bg{opacity:.1;filter:blur(2px)}
body[data-game="Tour du monde"] #bg{opacity:1;filter:none;display:block;--mh:min(max(52vh,40vw),78vh)}
#bg svg.world{position:absolute;max-width:none;max-height:none}

.mpr td{font-size:32px;font-weight:700}
body.wn #bg{opacity:1;filter:none;align-items:stretch;justify-content:stretch;top:calc(env(safe-area-inset-top,0px) + clamp(44px,13vw,96px) + 24px)}
body.wn #bg img{width:100%;height:100%;object-fit:cover;object-position:center top}
.wtop{font:700 clamp(44px,13vw,96px)/1 "Barlow Condensed",sans-serif;text-align:center;color:#fff;text-shadow:0 2px 12px #000,0 0 4px #000;margin-top:6px}
.wbot{font:700 clamp(36px,11vw,72px)/1.05 "Barlow Condensed",sans-serif;text-align:center;color:#fff;text-shadow:0 2px 12px #000,0 0 4px #000}
.wrap>.wsp{flex:1 1 auto}
#band{display:none;position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + clamp(44px,13vw,96px) + 24px);background-repeat:repeat-x;background-size:auto 100%;background-position:center;pointer-events:none;z-index:0}
body.wg #band{display:block}
.gold{background:linear-gradient(180deg,#fff2a8 0%,#f7c948 40%,#c9901a 70%,#f5d86a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.wbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:0 auto;width:100%;max-width:420px}
.step{flex:1;text-align:center;color:#1b1712;border-radius:8px 8px 0 0;padding:8px 4px;font-family:"Barlow Condensed",sans-serif;min-width:0}
.s0{height:175px;background:#e0b43a}
.s1{height:140px;background:#c3c6cc}
.s2{height:115px;background:#c98543}
.ps{font-size:18px;font-weight:600}
body[data-game="Shanghai"]{--bg:#0b1a2b;--panel:#13283f;--ink:#f1ead7;--mute:#9db2c7;--line:#2a4766;--red:#e8693a;--green:#2f9e9a;--hi:#1c3a58}
body[data-game="Shanghai"] .pad{grid-template-columns:repeat(3,1fr)}
.tgt{font:700 clamp(26px,8vw,40px) "Barlow Condensed",sans-serif;text-align:center;color:var(--red);margin-top:8px}
.tgt b{font-size:1.5em}
body[data-game="Tour du monde"]{--bg:#131313;--panel:#1f1f1f;--ink:#f4eedd;--mute:#a89f8c;--line:#3a3a3a;--red:#d63a2f;--green:#2f9e5f;--hi:#3a1a17}

body[data-game="Shanghai"] .pad button,body[data-game="Shanghai"] .mult button:not(.sel),body[data-game="Shanghai"] .card:not(.cur){background:rgba(16,34,54,.97);border-color:#4f7aa6}

.bondt{text-align:center;margin:calc(env(safe-area-inset-top,0px) + 10px) 0 0;position:relative}
.bondt .b1{font:600 clamp(30px,8.5vw,56px)/1.1 "Barlow Condensed",sans-serif;color:#fff;letter-spacing:2px;text-shadow:0 2px 10px #000,0 0 3px #000;animation:bondIn .9s .4s both}

body.wn.bond .wtop{text-shadow:0 2px 12px #000,0 0 4px #000}

.jst{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:18px;min-height:24px;margin-top:2px}
.jst .jn{font:700 15px Barlow,system-ui,sans-serif;color:var(--mute)}

#whfx .whr{opacity:0;transform:scale(.6);transition:opacity .35s,transform .35s cubic-bezier(.2,1.6,.4,1);text-align:center;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 35%,#000);border:2px solid var(--c);color:#fff;display:flex;flex-direction:column;gap:2px}

#bg.jkb .jkh.l{transform-origin:100% 100%}#bg.jkb .jkh.r{transform-origin:0 100%;animation-delay:-1.2s}#bg.jkb .jkh.m{transform-origin:50% 100%;animation-duration:3s}

'<h3>Pendant la partie</h3><ul><li>Sous chaque score, l’appli propose une combinaison pour finir avec les fléchettes qui restent.</li><li>La moyenne affichée est la moyenne par volée de 3 fléchettes.</li></ul>'+
'<h3>Fin de partie</h3><ul><li><b>Dernière chance</b> : quand un joueur termine, ceux qui jouent après lui dans le même tour peuvent encore tenter de finir. S’ils réussissent, il y a égalité. Un joueur qui ne peut plus finir en 3 fléchettes (plus de 180 points, ou de 170 en double-out) n’a pas de dernière chance.</li><li>Après le premier gagnant, les autres peuvent continuer pour les places suivantes, puis un podium s’affiche.</li></ul>'],
'Cricket':['Règles du Cricket',
'<h3>Numéros en jeu</h3><ul><li><b>Classique</b> : 15, 16, 17, 18, 19, 20 et Bull.</li><li><b>Aléatoire</b> : 7 numéros tirés au hasard parmi 1 à 20 et le Bull.</li><li><b>Complet</b> : 15 à 20 et Bull, plus trois lignes : Doubles, Triples et Beds.</li></ul>'+
'<h3>Fermer un numéro</h3><ul><li>Il faut <b>3 marques</b> pour fermer un numéro : simple = 1 marque, double = 2, triple = 3. Bull = 1 marque, Bull’s Eye = 2.</li><li>Les autres numéros ne comptent pas.</li></ul>'+
'<h3>Points (cricket inversé)</h3><ul><li>Une fois un numéro fermé chez vous, chaque marque de plus donne sa valeur en points <b>aux adversaires qui ne l’ont pas encore fermé</b>.</li><li>Quand tous les joueurs ont fermé un numéro, il est mort : le toucher ne sert plus à rien.</li><li>Les points sont mauvais : on cherche à en avoir le moins possible.</li></ul>'+
'<h3>Gagner</h3><ul><li>Le gagnant est le premier qui a <b>tout fermé</b> et qui a <b>le moins de points</b> (ou autant que les autres).</li><li>Si vous avez tout fermé mais trop de points, continuez à marquer pour en donner aux adversaires.</li></ul>'+
'<h3>Cricket complet</h3><ul><li><b>Doubles</b> : chaque double touché donne 1 marque sur cette ligne, en plus de ses marques sur le numéro.</li><li><b>Triples</b> : même principe avec les triples.</li><li><b>Beds</b> : 3 fléchettes du même tour sur le même numéro donnent 1 marque.</li><li>Points sur ces lignes une fois fermées : double = 2 × le numéro, triple = 3 × le numéro, bed = total des 3 fléchettes.</li></ul>'+
'<h3>MPR</h3><ul><li>Le MPR est le nombre moyen de marques utiles par tour. Une marque est utile si elle vous rapproche de la fermeture d’un numéro ou si elle donne des points à un adversaire. Une fléchette inutile fait baisser le MPR.</li></ul>'+
'<h3>Fin de partie</h3><ul><li><b>Dernière chance</b> pour les joueurs qui suivent dans le même tour, sauf s’ils ne peuvent plus gagner en 3 fléchettes (trop de numéros à fermer ou plus de points que le gagnant).</li><li>Les autres peuvent continuer pour les places suivantes.</li></ul>'],
'Killer':['Règles du Killer',
'<h3>Départ</h3><ul><li>Chaque joueur reçoit un <b>numéro tiré au hasard</b> et <b>3 vies</b>.</li></ul>'+
'<h3>Devenir killer</h3><ul><li>Touchez votre propre numéro pour gagner des points : simple = 1 point, double = 2 points, triple = 3 points.</li><li>À <b>3 points</b>, vous devenez <b>killer</b>.</li></ul>'+
'<h3>Attaquer</h3><ul><li>Un killer touche le numéro d’un adversaire avec la même valeur : simple = 1, double = 2, triple = 3.</li><li>Il retire d’abord les points que l’adversaire a pris pour devenir killer. Ensuite seulement, il lui retire des vies.</li><li>Un killer qui retombe sous 3 points n’est plus killer.</li></ul>'+
'<h3>Bonus</h3><ul><li><b>À partir du tour 8</b>, toutes les valeurs comptent double.</li><li>Un <b>Bull</b> double la fléchette suivante. Plusieurs Bulls d’affilée se cumulent (×2, ×4…).</li></ul>'+
'<h3>Gagner</h3><ul><li>Un joueur sans vie est éliminé. Le <b>dernier en vie</b> gagne.</li><li>Le MPR compte les fléchettes utiles : votre numéro tant que vous n’êtes pas killer, puis les numéros des adversaires encore en vie.</li></ul>'],
'Overs':['Règles du Overs',
'<h3>Départ</h3><ul><li>Chaque joueur commence avec <b>3 vies</b>.</li><li>Votre <b>première volée</b> fixe votre score à battre.</li></ul>'+
'<h3>À chaque tour</h3><ul><li>Vous devez faire <b>strictement plus</b> que votre volée précédente.</li><li>Si vous faites moins, ou juste autant, vous perdez <b>une vie</b>.</li><li>Dans tous les cas, votre nouvelle volée devient le score à battre.</li><li>Une fléchette <b>ratée</b> (bouton « Raté ») compte <b>5 points</b> : la volée continue, mais il faudra bien viser avec les suivantes.</li></ul>'+
'<h3>Le piège du 180</h3><ul><li>Après un 180, impossible de faire mieux au tour suivant : la vie est perdue à coup sûr.</li></ul>'+
'<h3>Gagner</h3><ul><li>Un joueur sans vie est éliminé. Le <b>dernier encore en vie</b> gagne.</li><li>La moyenne affichée est la moyenne de vos volées.</li></ul>'],
'Limbo':['Règles du Limbo',
'<h3>Départ</h3><ul><li>Chaque joueur a <b>3 vies</b> et lance <b>3 fléchettes</b> par tour.</li><li>La barre commence à <b>60</b>.</li></ul>'+
'<h3>Passer sous la barre</h3><ul><li>Le total de vos 3 fléchettes doit être <b>strictement inférieur</b> à la barre.</li><li>Si vous réussissez, votre score devient la nouvelle barre pour le joueur suivant. Elle descend donc de plus en plus.</li><li>Une fléchette <b>hors cible</b> compte <b>20 points</b> : la volée continue et vous pouvez encore rattraper avec de petits scores.</li></ul>'+
'<h3>Perdre une vie</h3><ul><li>Vous perdez une vie si votre total est <b>égal ou supérieur</b> à la barre.</li><li>Après une vie perdue, la barre <b>remonte à 60</b> pour le joueur suivant.</li><li>Le tour s’arrête dès que la barre est atteinte.</li><li>« Passer » avant la 3e fléchette : chaque fléchette non lancée compte comme hors cible (20 points).</li></ul>'+
'<h3>Gagner</h3><ul><li>Un joueur sans vie est éliminé. Le <b>dernier encore en vie</b> gagne.</li><li>« réussi 4/6 » indique le nombre de tours passés sous la barre sur le nombre de tours joués.</li></ul>'],
'Shanghai':['Règles du Shanghai',
'<h3>Déroulement</h3><ul><li>La partie se joue en <b>7 manches</b>. Chaque manche a un <b>numéro cible</b> tiré au hasard.</li><li>Seules les fléchettes sur la cible comptent : simple = valeur du numéro, double = ×2, triple = ×3.</li><li>À la 7e manche, un <b>Bull’s Eye</b> rapporte aussi <b>100 points</b>.</li></ul>'+
'<h3>Shanghai</h3><ul><li>Toucher le <b>simple, le double et le triple</b> de la cible dans le même tour fait gagner la partie immédiatement.</li><li>Les joueurs qui suivent dans la manche ont une dernière chance de faire aussi un Shanghai : il y a alors égalité.</li></ul>'+
'<h3>Gagner</h3><ul><li>Sans Shanghai, le joueur qui a <b>le plus de points</b> après les 7 manches gagne.</li></ul>'],
'Tour du monde':['Règles du Tour du monde',
'<h3>But du jeu</h3><ul><li>Touchez les numéros <b>dans l’ordre, de 1 à 20</b>, puis le <b>Bull</b> pour finir.</li><li>Seul le numéro que vous visez compte.</li></ul>'+
'<h3>Versions</h3><ul><li><b>Classique</b> : un double fait avancer de 2 cases, un triple de 3.</li><li><b>Entraînement</b> : seuls les simples comptent et font avancer d’une case.</li></ul>'+
'<h3>Rejouer</h3><ul><li>Si vos <b>3 fléchettes</b> sont bonnes, vous rejouez.</li><li>Si votre <b>dernière fléchette</b> est bonne, vous rejouez aussi.</li></ul>'+
'<h3>Gagner</h3><ul><li>Le premier qui touche le Bull après le 20 gagne.</li><li>Les joueurs qui suivent dans le même tour ont une dernière chance pour finir aussi.</li></ul>'],
'Training':['Règles du Training',
'<h3>But du jeu</h3><ul><li>Choisissez un <b>numéro à travailler</b> (1 à 20 ou Bull).</li><li>Seules les fléchettes sur ce numéro comptent : simple = 1 touche, double = 2, triple = 3. Au Bull : Bull = 1, Bull’s Eye = 2.</li></ul>'+
'<h3>Barres</h3><ul><li><b>3 touches dans la même volée</b> donnent <b>1 barre</b>.</li><li>On ne peut gagner qu’une barre par volée.</li></ul>'+
'<h3>Gagner</h3><ul><li>Le premier à <b>3 barres</b> gagne.</li><li>Les joueurs qui suivent dans le même tour ont une dernière chance, s’ils ont déjà 2 barres.</li><li>Le MPR est le nombre moyen de touches par tour.</li></ul>']};
RULES['301'][1]+='<h3>Variante Joker</h3><ul><li>Choisissez « Joker » après avoir cliqué sur le jeu. Les règles du 301 / 501 restent les mêmes, avec des cartes en plus.</li><li>Chaque joueur commence avec <b>une carte</b>. À votre tour, vous pouvez en jouer <b>une seule, avant votre première fléchette</b>.</li><li>Le <b>premier</b> (👑) est le joueur le plus proche de zéro. Toutes les attaques le visent.</li><li>À la fin de chaque manche, tout le monde pioche une carte, <b>sauf le premier</b>. On garde au maximum 3 cartes.</li></ul>'
 +'<h3>Les cartes</h3><ul><li><b>⇄ Échange</b> : vous échangez votre score avec celui du premier.</li><li><b>🛡️ Bouclier</b> : bloque la prochaine attaque contre vous.</li><li><b>⤴️ Recul</b> (attaque) : le premier reprend 40 points.</li><li><b>❄️ Gel</b> (attaque) : le premier passe son prochain tour.</li><li><b>×2 Coup double</b> : vos fléchettes comptent double ce tour.</li><li><b>✂️ Raccourci</b> : vous retirez 25 points à votre score.</li><li>Le premier ne peut pas jouer Échange, Recul ni Gel.</li></ul>'
 +'<h3>La roue du chaos</h3><ul><li>Elle tourne au début des manches 3, 5, 7… L’événement dure toute la manche.</li><li><b>🔥 Manche de feu</b> : chaque fléchette compte double.</li><li><b>❄️ Manche de glace</b> : les triples comptent comme des simples.</li><li><b>🃏 Pluie de cartes</b> : tout le monde pioche une carte.</li><li><b>🌋 Séisme</b> : le premier reprend 30 points (le bouclier le protège).</li><li><b>⭐ Bull en or</b> : un Bull ou un Bull’s Eye fait piocher une carte.</li><li><b>😴 Calme plat</b> : rien ne se passe.</li></ul>';

function showRules(){var r=RULES[cfg.g];if(!r)return;var o=$('rules');if(o)o.remove();
  o=document.createElement('div');o.id='rules';o.setAttribute('role','dialog');o.setAttribute('aria-label',r[0]);

  o.addEventListener('click',function(e){if(e.target===o)closeRules()});document.body.appendChild(o)}

  G=null;undo=[];delete document.body.dataset.game;setBg('');

  h+='<h2>Liste des joueurs</h2><div class="chips">'+roster.map(function(n,i){var on=names.indexOf(n)>=0;return'<span class="chip"><button '+(on||names.length>=MAXP?'disabled ':'')+'onclick="addR('+i+')">'+(on?'✓ ':'+ ')+esc(n)+'</button><button onclick="delR('+i+')" aria-label="Supprimer '+esc(n)+' de la liste">🗑</button></span>'}).join('')+'</div>';
  h+='<div class="pl"><input type="text" id="newp" maxlength="20" placeholder="Nouveau joueur" onkeydown="if(event.key===\'Enter\')newP()"><button class="main" onclick="newP()">Créer</button></div>';
  if(cfg.g==='301'||cfg.g==='501')h+='<p><label><input type="checkbox" '+(cfg.dbl?'checked':'')+' onchange="cfg.dbl=this.checked"> Finir sur un double (double-out)</label><br><label><input type="checkbox" '+(cfg.din?'checked':'')+' onchange="cfg.din=this.checked"> Commencer sur un double (double-in)</label></p>';
  if(false)h+='<p class="hint">Numéros 15 à 20 et bull. Fermez un numéro avec 3 touches. Cricket inversé : quand vous marquez sur un numéro encore ouvert chez un adversaire, ce sont ses points qui augmentent, pas les vôtres. Gagnant : celui qui a tout fermé avec le moins de points.</p>';
  var need=1;
  h+='<p><button class="main" '+(names.length<need?'disabled ':'')+'onclick="start()">Lancer la partie</button>'+(names.length<need?' <span class="hint">Ajoutez au moins '+need+' joueur'+(need>1?'s':'')+'.</span>':'')+'</p>';
  $('app').innerHTML=h;
}
function pickG(g){if(cfg.g===g&&names.length)return start();cfg.g=g;setup()}
function save(){try{localStorage.setItem('fl_names',JSON.stringify(names));localStorage.setItem('fl_roster',JSON.stringify(roster))}catch(e){}}

var MAXP=20;
function addR(i){if(names.indexOf(roster[i])<0&&names.length<MAXP)names.push(roster[i]);save();setup()}

function randT(){var a=[];for(var k=1;k<=20;k++)a.push(k);for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t}return a.slice(0,7)}
function randNums(){var a=[];for(var k=1;k<=20;k++)a.push(k);a.push(25);for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t}return a.slice(0,7).sort(function(x,y){return y-x})}

/* ---------- 301 / 501 Joker ---------- */
var JCARDS={swap:['⇄','Échange','Échangez votre score avec celui du premier.'],
  shield:['🛡️','Bouclier','Bloque la prochaine attaque contre vous.'],
  push:['⤴️','Recul','Le premier reprend 40 points.'],
  freeze:['❄️','Gel','Le premier passe son prochain tour.'],
  x2:['×2','Coup double','Vos fléchettes comptent double ce tour.'],
  cut:['✂️','Raccourci','Retirez 25 points à votre score.']};
var JDECK=['swap','shield','shield','push','push','freeze','x2','x2','cut','cut'];
var JEV={fire:['🔥','Manche de feu','Chaque fléchette compte double.','#e8501f','Fléchettes ×2'],
  ice:['❄️','Manche de glace','Les triples comptent comme des simples.','#3fa9f5','Triples = simples'],
  rain:['🃏','Pluie de cartes','Tout le monde pioche une carte.','#9b5de5','Tout le monde pioche'],
  quake:['🌋','Séisme','Le premier reprend 30 points.','#b5651d','Le premier reprend 30'],
  gold:['⭐','Bull en or','Un Bull ou un Bull’s Eye fait piocher une carte.','#d4a017','Bull = une carte'],
  calm:['😴','Calme plat','Rien ne se passe… pour cette fois.','#4b5563','Rien ne change']};
var JWHEEL=['fire','calm','ice','fire','rain','calm','quake','gold'];
function jDraw(){return JDECK[Math.floor(Math.random()*JDECK.length)]}
function jGive(o){if(!o.hand)o.hand=[];if(o.hand.length<3){o.hand.push(jDraw());return true}return false}
function jLeaders(){var a=G.p.filter(function(o){return o.alive}),m=Math.min.apply(null,a.map(function(o){return o.rem}));return a.filter(function(o){return o.rem===m})}
function jIsLeader(o){return jLeaders().indexOf(o)>=0}
function jAttack(fn,lbl){var out=[];jLeaders().forEach(function(t){if(t.shield){t.shield=false;out.push(t.n+' : bloqué par le bouclier')}else{fn(t);out.push(t.n+' '+lbl)}});return out.join(' · ')}
function jVal(p,num,m){var v=num*(G.ev==='ice'&&m===3?1:m);if(G.ev==='fire')v*=2;if(p.x2)v*=2;return v}
function jCan(p,c){if(G.turn.length||p.played||p.frozen)return'Seulement avant la première fléchette, une carte par tour';
  if((c==='swap'||c==='push'||c==='freeze')&&jIsLeader(p))return'Vous êtes le premier';
  if(c==='swap'&&G.din&&!p.open&&!jLeaders()[0].open)return'';
  if(c==='cut'&&p.rem-25<2)return'Score trop bas';
  if(c==='shield'&&p.shield)return'Bouclier déjà actif';
  return''}
function jPlay(k){var p=G.p[G.cur],c=p.hand[k];if(!c||jCan(p,c))return;undo.push(JSON.stringify(G));
  p.hand.splice(k,1);p.played=true;var nm=JCARDS[c][1],m='';
  if(c==='swap'){var t=jLeaders()[0],a=p.rem,o=!!p.open;p.rem=t.rem;p.open=!!t.open;t.rem=a;t.open=o;m=p.n+' échange avec '+t.n+' : '+t.rem+' ⇄ '+p.rem}
  else if(c==='shield'){p.shield=true;m=p.n+' lève son bouclier'}
  else if(c==='push')m=jAttack(function(t){t.rem=Math.min(G.base,t.rem+40)},'reprend 40 points');
  else if(c==='freeze')m=jAttack(function(t){t.frozen=true},'est gelé au prochain tour');
  else if(c==='x2'){p.x2=true;m=p.n+' : fléchettes doublées ce tour'}
  else if(c==='cut'){p.rem-=25;m=p.n+' retire 25 points'}
  G.msg=nm+' · '+m;G.jcard={c:c,i:G.cur};render()}
function jThaw(){undo.push(JSON.stringify(G));var p=G.p[G.cur];p.frozen=false;G.msg=p.n+' était gelé et passe son tour';endTurn(false)}
function jRound(){var L=jLeaders(),got=[];
  G.p.forEach(function(o){if(o.alive&&L.indexOf(o)<0&&jGive(o))got.push(o.n)});
  G.ev=null;var msg=got.length?'🃏 '+got.join(', ')+' pioche'+(got.length>1?'nt':'')+' une carte':'';
  if(G.round>=3&&G.round%2===1){var k=Math.floor(Math.random()*JWHEEL.length),e=JWHEEL[k];G.ev=e;G.wheel={k:k,ev:e};
    if(e==='rain')G.p.forEach(function(o){if(o.alive)jGive(o)});
    if(e==='quake')msg=jAttack(function(t){t.rem=Math.min(G.base,t.rem+30)},'reprend 30 points (séisme)')}
  G.msg=msg}
function jReply(o){var f=(G.ev==='fire'?2:1),hd=o.hand||[];
  var ok=function(rem,ff){JF=ff;var r=canOut(rem,!G.din||!!o.open,3);JF=1;return r};
  if(ok(o.rem,f))return true;if(hd.indexOf('x2')>=0&&ok(o.rem,f*2))return true;if(hd.indexOf('cut')>=0&&o.rem-25>=2&&ok(o.rem-25,f))return true;return false}
var JF=1;
function jHand(){var p=G.p[G.cur],ev=G.ev?JEV[G.ev]:null,h='';
  if(ev)h+='<div class="jev" style="--c:'+ev[3]+'"><b>'+ev[0]+' '+ev[1]+'</b> · '+ev[4]+'</div>';
  h+='<div class="jhand">'+((p.hand||[]).length?p.hand.map(function(c,k){var d=JCARDS[c],why=jCan(p,c);return'<button class="jc'+(why?' off':'')+'" '+(why?'aria-disabled="true" title="'+esc(why)+'" ':'')+'onclick="jPlay('+k+')"><i>'+d[0]+'</i><span>'+d[1]+'</span></button>'}).join(''):'<span class="jnone">Pas de carte</span>')+'</div>';
  return h}
function jStat(o){var s=[];if(jIsLeader(o))s.push('👑');if(o.shield)s.push('🛡️');if(o.frozen)s.push('❄️');if(o.x2&&o===G.p[G.cur])s.push('×2');
  return'<div class="jst">'+s.join(' ')+' <span class="jn">🃏 '+((o.hand||[]).length)+'</span></div>'}
function wheelFx(w){
  var ov=document.createElement('div');ov.id='whfx';var n=JWHEEL.length,seg=360/n,s='';
  for(var k=0;k<n;k++){var e=JEV[JWHEEL[k]],a0=(k*seg-90-seg/2)*Math.PI/180,a1=((k+1)*seg-90-seg/2)*Math.PI/180,am=(k*seg-90)*Math.PI/180;
    s+='<path d="M0 0L'+(100*Math.cos(a0)).toFixed(2)+' '+(100*Math.sin(a0)).toFixed(2)+'A100 100 0 0 1 '+(100*Math.cos(a1)).toFixed(2)+' '+(100*Math.sin(a1)).toFixed(2)+'Z" fill="'+e[3]+'" stroke="#111" stroke-width="1.5"/>'
