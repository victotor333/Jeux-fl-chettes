<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fléchettes – saisie manuelle</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecd9;--panel:#fffaf0;--ink:#1b1712;--mute:#6f6556;--line:#d8ccb2;--red:#b8302a;--green:#1f6f46;--on:#fffaf0;--hi:#fbe3a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--panel:#211b16;--ink:#f3ecd9;--mute:#a79a86;--line:#3a3128;--red:#e0584f;--green:#3fae75;--on:#15110e;--hi:#3b2f17}}
:root[data-theme="dark"]{--bg:#15110e;--panel:#211b16;--ink:#f3ecd9;--mute:#a79a86;--line:#3a3128;--red:#e0584f;--green:#3fae75;--on:#15110e;--hi:#3b2f17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.5px}
h1{font-size:30px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button.main{background:var(--red);color:#fff;border-color:var(--red)}
button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.games button{font-family:"Barlow Condensed",sans-serif;font-size:26px;padding:14px 4px}
input[type=text]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.pl{display:flex;gap:8px;margin:6px 0}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px}
.card.cur{border-color:var(--red);background:var(--hi)}
.card.out{opacity:.4}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:"Barlow Condensed",sans-serif;font-size:56px;line-height:1;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:center}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:22px}
th{font-weight:600}
th:first-child,td:first-child{text-align:left}
.cur-col{background:var(--hi)}
.status{min-height:26px;margin:10px 0 6px;font-weight:600}
.darts{display:flex;gap:6px;margin:6px 0}
.dart{flex:1;text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:6px;font-family:"Barlow Condensed",sans-serif;font-size:22px;min-height:38px}
.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{padding:12px 0;font-size:20px;font-family:"Barlow Condensed",sans-serif}
.pad button:disabled{opacity:.25}
.win{background:var(--green);color:#fff;border-radius:12px;padding:14px;text-align:center;margin:10px 0}
.win .big{font-size:40px}
body[data-game="301"]{--bg:#0e3b2c;--panel:#145039;--ink:#f3ecd5;--mute:#a8cdb6;--line:#2b7656;--red:#d5412f;--green:#2f9e6c;--hi:#1f6a4c}
body[data-game="501"]{--bg:#131313;--panel:#1f1f1f;--ink:#f4eedd;--mute:#a89f8c;--line:#3a3a3a;--red:#d63a2f;--green:#2f9e5f;--hi:#3a1a17}
body[data-game="Cricket"]{--bg:#22302b;--panel:#2a3b35;--ink:#f2f0e6;--mute:#b7c4bb;--line:#4f6a5f;--red:#e2735f;--green:#5fb48b;--hi:#36524a}
body[data-game="Killer"]{--bg:#12080d;--panel:#20101a;--ink:#f6e8ea;--mute:#b49aa2;--line:#4a2433;--red:#ff3b4a;--green:#b3203f;--hi:#3a1220}
body[data-game="301"] .big,body[data-game="501"] .big{font-size:72px}
.bar01{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar01 i{display:block;height:100%;background:var(--red)}
body[data-game="Cricket"] h2{font-family:"Permanent Marker","Barlow Condensed",cursive}
body[data-game="Cricket"] td{font-size:26px;border-bottom:1px dashed var(--line)}
body[data-game="Cricket"] .closed{color:var(--green)}
body[data-game="Cricket"] .pad{grid-template-columns:repeat(5,1fr)}
body[data-game="Cricket"] .pad button{padding:18px 0;font-size:24px}
body[data-game="Killer"] h2{color:var(--red)}
body[data-game="Killer"] .card{text-align:center}
.badge{width:64px;height:64px;border-radius:50%;border:4px solid var(--red);display:flex;align-items:center;justify-content:center;font:700 30px "Barlow Condensed",sans-serif;margin:6px auto;box-shadow:0 0 0 4px var(--panel),0 0 0 6px var(--line)}
.hearts{color:var(--red);font-size:24px}
.hearts span{opacity:.25}
.card.kil{border-color:var(--red);box-shadow:0 0 14px var(--red)}
.status.x2{color:var(--red)}
#bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:.3;pointer-events:none;z-index:0}
#bg svg{width:min(95vmin,720px);height:min(95vmin,720px)}
.wrap{position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.chip.on{border-color:var(--green);padding-left:12px;font-weight:600}
.chip button{border:0;background:transparent;border-radius:0;padding:8px 12px}
.chip button:disabled{opacity:.5}
body[data-game] #bg{display:none}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><div class="wrap" id="app"></div>
<script>
var askQuit=false, G=null, undo=[], names=[], roster=[], cfg={g:'501',dbl:false};
try{var sv=JSON.parse(localStorage.getItem('fl_names')||'null');if(sv&&sv.length)names=sv;var sr=JSON.parse(localStorage.getItem('fl_roster')||'null');roster=(sr&&sr.length)?sr:[];names.forEach(function(n){if(roster.indexOf(n)<0)roster.push(n)})}catch(e){}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function setup(){
  G=null;undo=[];delete document.body.dataset.game;
  var h='<h1>Fléchettes</h1><p class="hint">Choisissez un jeu, puis saisissez chaque fléchette à tour de rôle.</p><div class="games">';
  ['301','501','Cricket','Killer'].forEach(function(g){h+='<button class="'+(cfg.g===g?'sel':'')+'" onclick="cfg.g=\''+g+'\';setup()">'+g+'</button>'});
  h+='</div><h2>Joueurs actifs</h2><div class="chips">'+(names.length?names.map(function(n,i){return'<span class="chip on">'+esc(n)+'<button onclick="rm('+i+')" aria-label="Retirer '+esc(n)+' de la partie">✕</button></span>'}).join(''):'<span class="hint">Aucun joueur : ajoutez-en depuis la liste ci-dessous.</span>')+'</div>';
  h+='<h2>Liste des joueurs</h2><div class="chips">'+roster.map(function(n,i){var on=names.indexOf(n)>=0;return'<span class="chip"><button '+(on||names.length>=8?'disabled ':'')+'onclick="addR('+i+')">'+(on?'✓ ':'+ ')+esc(n)+'</button><button onclick="delR('+i+')" aria-label="Supprimer '+esc(n)+' de la liste">🗑</button></span>'}).join('')+'</div>';
  h+='<div class="pl"><input type="text" id="newp" maxlength="20" placeholder="Nouveau joueur (ex. Antoine)" onkeydown="if(event.key===\'Enter\')newP()"><button class="main" onclick="newP()">Créer</button></div>';
  if(cfg.g==='301'||cfg.g==='501')h+='<p><label><input type="checkbox" '+(cfg.dbl?'checked':'')+' onchange="cfg.dbl=this.checked"> Finir sur un double (double-out)</label></p>';
  if(cfg.g==='Killer')h+='<p class="hint">Chaque joueur reçoit un numéro au hasard. Pour devenir killer, touchez votre propre numéro : simple = 1, double ou triple = 2, il en faut 3 en tout. Ensuite, chaque touche sur le numéro d’un adversaire lui retire des vies (simple = 1, double ou triple = 2). À partir du 9e tour, tout compte double. 3 vies chacun.</p>';
  if(cfg.g==='Cricket')h+='<p class="hint">Numéros 15 à 20 et bull. Fermez un numéro avec 3 touches. Cricket inversé : quand vous marquez sur un numéro encore ouvert chez un adversaire, ce sont ses points qui augmentent, pas les vôtres. Gagnant : celui qui a tout fermé avec le moins de points.</p>';
  var need=(cfg.g==='Cricket'||cfg.g==='Killer')?2:1;
  h+='<p><button class="main" '+(names.length<need?'disabled ':'')+'onclick="start()">Lancer la partie</button>'+(names.length<need?' <span class="hint">Ajoutez au moins '+need+' joueur'+(need>1?'s':'')+'.</span>':'')+'</p>';
  $('app').innerHTML=h;
}
function save(){try{localStorage.setItem('fl_names',JSON.stringify(names));localStorage.setItem('fl_roster',JSON.stringify(roster))}catch(e){}}
function rm(i){names.splice(i,1);save();setup()}
function addR(i){if(names.indexOf(roster[i])<0&&names.length<8)names.push(roster[i]);save();setup()}
function delR(i){var n=roster.splice(i,1)[0],j=names.indexOf(n);if(j>=0)names.splice(j,1);save();setup()}
function newP(){var v=$('newp').value.trim();if(!v)return;var k=roster.map(function(r){return r.toLowerCase()}).indexOf(v.toLowerCase());if(k<0){roster.push(v);k=roster.length-1}addR(k)}

function start(){
  names=names.map(function(n,i){return n.trim()||'Joueur '+(i+1)});
  try{localStorage.setItem('fl_names',JSON.stringify(names))}catch(e){}
  var pool=[];for(var k=1;k<=20;k++)pool.push(k);
  pool.sort(function(){return Math.random()-.5});
  var base=(cfg.g==='301'?301:501);
  G={g:cfg.g,dbl:cfg.dbl,base:base,round:1,cur:0,mult:1,turn:[],msg:'',win:null,
    p:names.map(function(n,i){return{n:n,rem:base,start:base,marks:{},pts:0,num:pool[i],lives:3,killer:false,alive:true}})};
  undo=[];render();
}

function dart(num){
  undo.push(JSON.stringify(G));
  var m=num===0?1:G.mult; if(num===25&&m===3)m=2;
  var p=G.p[G.cur]; G.msg=''; G.turn.push({num:num,m:m});
  if(G.g==='301'||G.g==='501'){
    if(G.turn.length===1)p.start=p.rem;
    var r=p.rem-num*m;
    if(r<0||(G.dbl&&(r===1||(r===0&&m!==2)))){p.rem=p.start;G.msg='Bust ! Score remis à '+p.start;return endTurn(true)}
    p.rem=r; if(r===0){G.win=G.cur;return render()}
  }else if(G.g==='Cricket'){
    if(num>=15){
      var cur=p.marks[num]||0, add=m;
      while(add>0){ if(cur<3){cur++}else{ G.p.forEach(function(o,i){if(i!==G.cur&&(o.marks[num]||0)<3)o.pts+=num}) } add--}
      p.marks[num]=cur;
      var all=[15,16,17,18,19,20,25].every(function(n){return(p.marks[n]||0)>=3});
      var top=G.p.every(function(o,i){return i===G.cur||o.pts>=p.pts});
      if(all&&top){G.win=G.cur;return render()}
    }
  }else{
    if(num>=1&&num<=20){
      var dmg=(m>=2?2:1)*(G.round>8?2:1);
      if(!p.killer&&num===p.num){p.prog=Math.min(3,(p.prog||0)+dmg);if(p.prog>=3){p.killer=true;G.msg=p.n+' devient killer !'}else G.msg=p.n+' : '+p.prog+'/3'}
      else if(p.killer&&num!==p.num){
        G.p.forEach(function(o){if(o.alive&&o.num===num){o.lives=Math.max(0,o.lives-dmg);G.msg=o.n+' perd '+dmg+(dmg>1?' vies':' vie');if(o.lives<=0){o.alive=false;G.msg=o.n+' est éliminé'}}});
        var al=G.p.filter(function(o){return o.alive});
        if(al.length===1){G.win=G.p.indexOf(al[0]);return render()}
      }
    }
  }
  if(G.turn.length>=3)return endTurn(false);
  G.mult=1;render();
}
function endTurn(bust){
  var n=G.p.length,i=G.cur;
  do{i=(i+1)%n}while(!G.p[i].alive);
  if(i<=G.cur)G.round++;G.cur=i;G.turn=[];G.mult=1;
  render();
}
function pass(){undo.push(JSON.stringify(G));G.msg='';endTurn(false)}
function back(){if(undo.length){G=JSON.parse(undo.pop());render()}}
function setMult(m){G.mult=m;render()}

function lbl(d){return d.num===0?'Raté':(['','S','D','T'][d.m])+(d.num===25?'Bull':d.num)}
function render(){
  document.body.dataset.game=G.g;
  var h='<div class="bar"><h2>'+G.g+'</h2><div class="row">'+(askQuit?'<span>Quitter la partie ?</span><button class="main" onclick="askQuit=false;setup()">Oui</button><button onclick="askQuit=false;render()">Non</button>':'<button onclick="askQuit=true;render()">Menu</button>')+'</div></div>';
  if(G.g==='Cricket'){
    h+='<div class="scroll"><table><tr><th></th>'+G.p.map(function(p,i){return'<th class="'+(i===G.cur?'cur-col':'')+'">'+esc(p.n)+'</th>'}).join('')+'</tr>';
    [20,19,18,17,16,15,25].forEach(function(n){
      h+='<tr><td>'+(n===25?'Bull':n)+'</td>'+G.p.map(function(p,i){var k=p.marks[n]||0;return'<td class="'+(i===G.cur?'cur-col':'')+(k>=3?' closed':'')+'">'+['·','/','✕','Ⓧ'][k]+'</td>'}).join('')+'</tr>'});
    h+='<tr><td>Points</td>'+G.p.map(function(p,i){return'<td class="'+(i===G.cur?'cur-col':'')+'"><b>'+p.pts+'</b></td>'}).join('')+'</tr></table></div>';
  }else{
    h+='<div class="cards">'+G.p.map(function(p,i){
      var body=G.g==='Killer'
        ?'<div class="badge">'+p.num+'</div><div class="hearts">'+(p.alive?'♥'.repeat(p.lives)+'<span>'+'♥'.repeat(3-p.lives)+'</span>':'☠')+'</div><div class="sub">'+(p.alive?(p.killer?'killer':(p.prog||0)+'/3 pour devenir killer'):'éliminé')+'</div>'
        :'<div class="big">'+p.rem+'</div><div class="bar01"><i style="width:'+Math.round(p.rem/G.base*100)+'%"></i></div><div class="sub">restant</div>';
      return'<div class="card '+(i===G.cur?'cur':'')+(p.alive?'':' out')+(p.killer?' kil':'')+'"><div class="name">'+esc(p.n)+'</div>'+body+'</div>'}).join('')+'</div>';
  }
  if(G.win!==null){
    h+='<div class="win"><div class="big">'+esc(G.p[G.win].n)+' gagne !</div></div><div class="row"><button class="main" onclick="start()">Rejouer</button><button onclick="setup()">Changer de jeu</button></div>';
    $('app').innerHTML=h;return;
  }
  h+='<div class="status'+(G.g==='Killer'&&G.round>8?' x2':'')+'">'+(G.msg?esc(G.msg):'Au tour de '+esc(G.p[G.cur].n))+(G.g==='Killer'?' · tour '+G.round+(G.round>8?' (dégâts ×2)':''):'')+'</div>';
  h+='<div class="darts">'+[0,1,2].map(function(i){return'<div class="dart">'+(G.turn[i]?lbl(G.turn[i]):'')+'</div>'}).join('')+'</div>';
  h+='<div class="mult">'+[['Simple',1],['Double',2],['Triple',3]].map(function(a){return'<button class="'+(G.mult===a[1]?'sel':'')+'" onclick="setMult('+a[1]+')">'+a[0]+'</button>'}).join('')+'</div>';
  var nums=[];
  if(G.g==='Cricket')nums=[15,16,17,18,19,20,25,0];
  else{for(var k=1;k<=20;k++)nums.push(k);nums.push(25,0)}
  h+='<div class="pad">'+nums.map(function(n){var dis=(n===25&&G.mult===3);return'<button '+(dis?'disabled ':'')+'onclick="dart('+n+')">'+(n===0?'Raté':n===25?'Bull':n)+'</button>'}).join('')+'<button onclick="back()" aria-label="Annuler la dernière fléchette">↩</button></div>';
  h+='<p><button onclick="pass()">Passer le tour</button></p>';
  $('app').innerHTML=h;
}
function boardSvg(){
  var o=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],s='<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><circle cx="200" cy="200" r="180" fill="#111"/>';
  function pt(t,r){return(200+r*Math.sin(t)).toFixed(1)+' '+(200-r*Math.cos(t)).toFixed(1)}
  function arc(a,b,r1,r2){return'M'+pt(a,r1)+'A'+r1+' '+r1+' 0 0 1 '+pt(b,r1)+'L'+pt(b,r2)+'A'+r2+' '+r2+' 0 0 0 '+pt(a,r2)+'Z'}
  for(var i=0;i<20;i++){
    var a=(i-.5)*Math.PI/10,b=(i+.5)*Math.PI/10,k=i%2,c=k?'#efe6cf':'#1b1712',d=k?'#1f6f46':'#b8302a';
    s+='<path d="'+arc(a,b,170,160)+'" fill="'+d+'"/><path d="'+arc(a,b,160,107)+'" fill="'+c+'"/><path d="'+arc(a,b,107,97)+'" fill="'+d+'"/><path d="'+arc(a,b,97,16)+'" fill="'+c+'"/>';
    var m=i*Math.PI/10;
    s+='<text x="'+(200+176*Math.sin(m)).toFixed(1)+'" y="'+(200-176*Math.cos(m)+4).toFixed(1)+'" font-size="11" fill="#efe6cf" text-anchor="middle" font-family="sans-serif" font-weight="700">'+o[i]+'</text>';
  }
  return s+'<circle cx="200" cy="200" r="16" fill="#1f6f46"/><circle cx="200" cy="200" r="7" fill="#b8302a"/></svg>';
}
$('bg').innerHTML=boardSvg();
setup();
</script>
</body>
</html>
